services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mapa-megaweb-backend
    env_file:
      - .env
    ports:
      - "0.0.0.0:5000:5000"
    volumes:
      # Última lista buena de empresas habilitadas (sobrevive reinicios).
      - ./data:/app/data
    restart: unless-stopped

